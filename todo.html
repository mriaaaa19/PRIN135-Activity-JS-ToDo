<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prin135 To-Do List</title>
    </head>

  <body>
    <main>
    <fieldset class="listContainer">
        <h1> To-Do List</h1>
    <section class="todo-add">
        <form>
            <label for="ToDo Description"></label>
            <input
                type="text"
                name="name-todo"
                id="name-todo"
                required
                placeholder="What needs to be done?"
            />
            <label for="ToDo Hours"></label>
            <input
                type="text"
                name="hours-todo"
                id="hours-todo"
                required
            />

            <button class="add-btn" type="submit">Add</button>

            <p> <a href="#all">All </a> </p>
            
    <section class="checkbox-todo"></section>
            <input type="checkbox">
            <label>Task 1</label>
            
    </section>
        </form>
    </section>



    </fieldset>
    </main>







  </body>
